[project]
name = "ussc-database"
version = "0.1.0"
description = "Build a DuckDB database from the U.S. Sentencing Commission individual offender datafiles"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "requests", "huggingface_hub", "pyyaml", "datapond-build"]

[tool.uv.sources]
datapond-build = { git = "https://github.com/datapond-db/datapond-build", tag = "v0.1.0" }
