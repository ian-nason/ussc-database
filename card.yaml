repo: Nason/ussc-database
file: ussc.duckdb
pretty_name: U.S. Sentencing Commission Individual Offender Database (FY2002-FY2025)
title: USSC Federal Sentencing Database
license: other
tags: [sentencing, criminal-justice, federal-courts, ussc, duckdb, datapond]
size_category: 10M<n<100M
alias: ussc
table_columns: [description, row_count, column_count]
intro: |
  Every federal defendant sentenced from FY2002 through FY2025 (1.72M), from the U.S.
  Sentencing Commission's public individual offender datafiles: demographics, offense
  of conviction, guideline calculations, sentence imposed, departures and variances.
  The Commission's ~22,000-variable fixed-width layout is reshaped into a wide
  `sentences` table plus long tables per count of conviction, guideline computation,
  drug type and departure reason.
quick_start_sql: |
  SELECT fiscal_year, COUNT(*) AS defendants,
         ROUND(AVG(prison_months) FILTER (WHERE term_type = 'months'), 1) AS mean_months_when_term_stated,
         COUNT(*) FILTER (WHERE term_type = 'life') AS life
  FROM ussc.v_sentence_terms GROUP BY 1 ORDER BY 1;
  -- TOTPRISN alone is not averageable: 9992/9996/9997/9998 are codes (under a day / life /
  -- no term stated / death), which the view separates into term_type.
footer: |
  Build pipeline, the USSC codebook and caveats: https://github.com/ian-nason/ussc-database
  Source: https://www.ussc.gov/research/datafiles/commission-datafiles (public domain).
